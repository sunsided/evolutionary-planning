[package]
name = "evolutionary-planning"
description = "Evolutionary planning: genetic algorithms, evolution strategies and multi-objective evolutionary search over plans, paths and trajectories"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/evolutionary-planning"
readme = "README.md"
keywords = ["evolutionary", "genetic-algorithm", "planning", "nsga2", "metaheuristic"]
categories = ["algorithms", "science", "no-std"]

[features]
## GA over SAS+ action sequences with plan repair (the `sas` module).
sas-plus = ["dep:sas-plus"]

[dependencies]
# Exponentials, logarithms, square roots and trigonometry under no_std.
libm = "0.2.16"
# The generator trait every algorithm draws its randomness from.
rand_core = { version = "0.10.1", default-features = false }
# The shared Budget trait of the planning crates.
search-core = { path = "../search-core", version = ">=0.0.0, <0.2", default-features = false }
# SAS+ tasks for the plan GA; read-only, behind the `sas-plus` feature.
sas-plus = { path = "../sas-plus", version = "0.2.1", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"
sas-plus = { path = "../sas-plus", version = "0.2.1", features = ["random"] }

# The convergence tests run hundreds of thousands of evaluations; unoptimised they take minutes.
[profile.test]
opt-level = 2

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "algorithms"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
