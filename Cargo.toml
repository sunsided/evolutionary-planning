[package]
name = "evolutionary-planning"
description = "Evolutionary planning for no_std: genetic algorithms, evolution strategies, CMA-ES and multi-objective evolutionary search over plans, paths and trajectories"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/evolutionary-planning"
homepage = "https://sunsided.github.io/planning-and-search/crates/evolutionary-planning/"
readme = "README.md"
keywords = ["genetic-algorithm", "evolutionary", "cma-es", "nsga2", "planning"]
categories = ["algorithms", "artificial-intelligence", "science::robotics", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[features]
## GA over SAS+ action sequences with plan repair (the `sas` module).
sas-plus = ["dep:sas-plus"]

[dependencies]
# Exponentials, logarithms, square roots and trigonometry under no_std.
libm = "0.2.16"
# The generator trait every algorithm draws its randomness from.
rand_core = { version = "0.10.1", default-features = false }
# The shared Budget trait of the planning crates.
search-core = { version = "0.3", default-features = false }
# SAS+ tasks for the plan GA; read-only, behind the `sas-plus` feature.
sas-plus = { version = "0.2.1", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"
sas-plus = { version = "0.2.1", features = ["random"] }

# The convergence tests run hundreds of thousands of evaluations; unoptimised they take minutes.
[profile.test]
opt-level = 2

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[[bench]]
name = "algorithms"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
